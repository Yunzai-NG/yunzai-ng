# 发布：把四个包同时推到 npmjs 与 GitHub Packages
#
# 由 tag 触发而非分支推送 —— 发布不可撤销（版本号一旦发出，即便 unpublish 也永久
# 不可复用），必须是一个明确的动作，不能是「往 main 推了一下」的副作用。
#
# 两个 registry 由同一次运行发出，是这个文件存在的唯一理由：手工跑两条命令时，
# 第一条成功第二条失败不会当场暴露，而 @yunzai-ng/cli 对 core 是钉死版本号的硬依赖，
# 只发成功一边，另一边的 cli 就装不上。
#
# 各包独立版本号：只有改动过的包升版本，未改动的留在原处。tag 因此不代表
# 「四个包都是这个号」，只是这次发布的编号（取自根 package.json）。哪些包真的发出去，
# 由「先查后发」逐包按 registry 上有没有这个版本决定 —— 版本号本身就是唯一的判据，
# 不必另记一份「本次要发哪些」的清单。
#
# 重跑是安全的，两边各有各的理由：npmjs 那步逐包先 `npm view` 再决定发不发，
# GitHub Packages 那步由 `pnpm -r publish` 自行跳过已存在的版本。所以某一边失败后
# 可以从同一个 tag 上重新 dispatch，已经发成功的那边不会被动到。
#
# npmjs 与 GitHub Packages 用的不是同一条命令：前者需要 provenance，而 pnpm 9.15
# 收下 `--provenance` 却不产出 attestation 也不报错。详见「打包」那一步的注释。
name: 发布

on:
  push:
    tags: ["v*"]
  # 供某一个 registry 失败后，从同一个 tag 上重跑
  workflow_dispatch:

# 不设 cancel-in-progress：取消一次进行中的发布，可能正停在
# 「npmjs 发了、GitHub Packages 没发」这个最难收拾的状态上
concurrency:
  group: publish-${{ github.ref }}

permissions:
  contents: write # 建 Release
  id-token: write # npmjs provenance 的 OIDC 凭据
  packages: write # GitHub Packages

env:
  # 仓库内 .npmrc 固定为 npmmirror（国内网络所需），而 runner 在境外。
  # 两个 publish 步骤另各自显式带 --registry，不依赖这一条。
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.11"
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # 发布前跑满门禁：构建、分层、首次启动、类型检查、lint、604 个用例。
      # 发出去的包改不回来，这是最后一道拦得住的地方。
      - name: 全量校验
        run: pnpm run verify

      # 各包独立版本号：未改动的包留在旧版本，由后面「先查后发」逐包跳过。
      # tag 因此不代表「四个包都是这个号」，而只是**这次发布的编号**，取自根
      # package.json（它是 private，不发布，正好适合充当这个编号）。
      #
      # 校验它与 tag 一致：对不上的话 Release 指着一个号、发出去的是另一批内容，
      # 之后谁都对不上账。宁可在这里失败。
      - name: 校验 tag 与发布编号一致
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root=$(node -p "require('./package.json').version")
          if [ "$root" != "$tag" ]; then
            echo "::error::tag 为 $tag，但根 package.json 的发布编号是 $root"
            exit 1
          fi
          echo "本次发布编号 $tag，各包版本："
          for p in types core jsx cli; do
            echo "  @yunzai-ng/$p  $(node -p "require('./packages/$p/package.json').version")"
          done

      # 「装 cli 就唯一确定另外三个」这条不变量，得靠一道门禁守住
      #
      # `pnpm pack` 把 `workspace:*` 改写成**精确**版本号（下面那步核对的正是这件事），
      # 于是 cli 0.4.0 的依赖里写着 `"@yunzai-ng/core": "0.5.0"` 这个死数。只发 core
      # 不发 cli 的后果是：新的 core 躺在 npm 上而谁都到不了 —— `yzng update` 只升 cli，
      # 装到的还是老 cli，它又把 core 钉在旧版本上，四个包一个都不动，而命令报的是
      # 「已是 latest 对应的版本」。0.5.1 就是这么发出去一个装不到的版本。
      #
      # 故：另外三个包里**任一个**要发新版，cli 必须跟着抬一个号，哪怕它只是重新钉一遍
      # 依赖 —— 那个重新钉过的依赖表就是它这一版的全部内容，也确实是内容。
      #
      # 反过来「只发 cli」是允许的（修 CLI 自身的缺陷），故判据是单向的。
      - name: 校验 cli 跟着一起发
        run: |
          need=""
          for p in types core jsx; do
            v=$(node -p "require('./packages/$p/package.json').version")
            if ! npm view "@yunzai-ng/$p@$v" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              need="$need @yunzai-ng/$p@$v"
            fi
          done
          cliv=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@yunzai-ng/cli@$cliv" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            if [ -n "$need" ]; then
              echo "::error::本次要发$need，但 @yunzai-ng/cli@$cliv 已在 npm 上。cli 对这几个包是钉死版本号的依赖，不一并抬 cli 的话新版本装不到（yzng update 会报「已是最新」）。请把 packages/cli/package.json 的版本号加一个 patch，根 package.json 的发布编号与 tag 一并跟上"
              exit 1
            fi
            echo "本次无需发 cli（$cliv 已在 npm 上，且另外三个包也都没有新版本）"
          else
            echo "cli 将发出 $cliv，带上$need"
          fi

      # 凭据按 registry 主机名分别写入，不走 setup-node 的 registry-url：
      # 这里要同时对两个 registry 认证，一个 registry-url 表达不了。
      # 两个 token 都不要回显，~/.npmrc 也不要 cat。
      - name: 写入两个 registry 的凭据
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 为什么不是 `pnpm publish --provenance`：pnpm 9.15 收下这个参数却不产出
      # attestation，且不报错 —— 0.1.1 就是这样发出去一个没有 provenance 的版本。
      # 改为 `pnpm pack` 出 tarball、再交给 npm 发布：pack 会把内部依赖的
      # `workspace:*` 改写成真实版本号（下一步会核对），而 provenance 由 npm 自己生成。
      - name: 打包（workspace:* 在此改写为版本号）
        run: |
          mkdir -p .tarballs
          for dir in packages/*/; do
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/.tarballs")
          done
          ls -l .tarballs

      # 这一条只为拦住一种情形：tarball 里仍留着 `workspace:*`。它装不上，而且
      # 只有别人安装时才会暴露 —— 作者自己怎么测都碰不到。
      - name: 核对 tarball 里没有 workspace 协议
        run: |
          for tgz in .tarballs/*.tgz; do
            if tar -xzOf "$tgz" package/package.json | grep -q '"workspace:'; then
              echo "::error::$tgz 里仍有 workspace: 协议，装的人会拿到一个装不上的包"
              exit 1
            fi
          done
          echo "四个 tarball 的内部依赖均已改写为版本号"

      # 顺序即依赖顺序：types 最先，cli 最后。反过来发会有一段时间线上的包指向
      # 尚不存在的版本。新增包时这个清单要跟着改。
      #
      # 先查后发而非直接发：npm publish 遇到已存在的版本会以 EPUBLISHCONFLICT 失败，
      # 那会让「某一边失败后从同一个 tag 重跑」这条不再成立。
      - name: 发布到 npmjs（带 provenance）
        run: |
          : > .tarballs/published.txt
          for p in types core jsx cli; do
            v=$(node -p "require('./packages/$p/package.json').version")
            if npm view "@yunzai-ng/$p@$v" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "@yunzai-ng/$p@$v 已在 npmjs 上，跳过"
              continue
            fi
            npm publish ".tarballs/yunzai-ng-$p-$v.tgz" --access public --provenance --registry=https://registry.npmjs.org/
            echo "$p $v" >> .tarballs/published.txt
          done
          # 一个包都没发不算失败：从同一个 tag 重跑（例如上次只有 GitHub Packages 挂了）
          # 时本步骤本就无事可做
          if [ -s .tarballs/published.txt ]; then
            echo "本次发往 npmjs 的是："
            cat .tarballs/published.txt
          else
            echo "本次没有需要发往 npmjs 的包"
          fi

      - name: 发布到 GitHub Packages
        run: >
          pnpm -r --filter "./packages/*" publish
          --access public --no-git-checks
          --registry=https://npm.pkg.github.com/

      # 放在两次 publish 之后：Release 是给人看的公告，它不该早于包真的可装
      - name: 建 Release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 放在最后、且真的会让作业变红：0.1.1 那次「步骤全绿而 attestation 不存在」
      # 是这个文件里最值得防的一种失败 —— 绿灯本身成了误导。此处失败不影响已发出的
      # 包，它只是把「provenance 没挂上」这件事变成看得见的。
      #
      # 只核对**本次发出**的包：未改动的包留在旧版本，而 0.1.1 及更早是从本机发的，
      # 本来就没有 attestation，拿它们来核对只会得到一条必然失败的断言。
      - name: 核对 provenance 真的挂上了
        run: |
          if [ ! -s .tarballs/published.txt ]; then
            echo "本次没有发出任何包，无需核对"
            exit 0
          fi
          while read -r p v; do
            url="https://registry.npmjs.org/-/npm/v1/attestations/@yunzai-ng%2F$p@$v"
            code=000
            # registry 有短暂的传播延迟，重试几次再判定
            for _ in 1 2 3 4 5; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || echo 000)
              [ "$code" = "200" ] && break
              sleep 6
            done
            if [ "$code" != "200" ]; then
              echo "::error::@yunzai-ng/$p@$v 没有 attestation（$url → $code）"
              exit 1
            fi
            echo "@yunzai-ng/$p@$v provenance 已挂上"
          done < .tarballs/published.txt
